<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MESP — wrist-worn multi-parameter digital health monitor with BLE connectivity. Engineering prototype, not a medical device." />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MESP — Wrist-worn health monitor platform</title>
    <script>
      try { const t = localStorage.getItem('mesp.theme'); const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.classList.toggle('dark', dark) } catch {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
